<!doctype html>
<html><head><meta charset="utf-8">
<style>
  :root { --bg:#fff; --fg:#111827; --muted:#6b7280; --btn:#f3f4f6; --btn-hover:#e5e7eb; --accent:#4f46e5; }
  @media (prefers-color-scheme: dark) { :root { --bg:#18181b; --fg:#f4f4f5; --muted:#a1a1aa; --btn:#27272a; --btn-hover:#3f3f46; --accent:#818cf8; } }
  body { margin:0; width:250px; padding:12px; background:var(--bg); color:var(--fg); font:13px -apple-system, system-ui, sans-serif; }
  .stats { display:flex; gap:12px; margin-bottom:10px; }
  .stat b { display:block; font-size:20px; }
  .stat span { color:var(--muted); font-size:11px; }
  button { display:block; width:100%; margin:6px 0 0; padding:8px 10px; border:0; border-radius:6px; background:var(--btn); color:var(--fg); text-align:left; font:inherit; cursor:pointer; }
  button:hover { background:var(--btn-hover); }
  button.primary { background:var(--accent); color:#fff; }
  kbd { float:right; color:var(--muted); font:11px ui-monospace, monospace; }
  button.primary kbd { color:#e0e7ff; }
  p { color:var(--muted); font-size:11px; margin:10px 0 0; }
</style></head>
<body>
  <div class="stats">
    <div class="stat"><b id="live">–</b><span>live</span></div>
    <div class="stat"><b id="asleep">–</b><span>on standby</span></div>
  </div>
  <button class="primary" id="others">Standby other tabs <kbd>⌥⇧S</kbd></button>
  <button id="current">Standby this tab <kbd>⌥⇧Z</kbd></button>
  <button id="all">Standby every window</button>
  <p>Click a standby tab to wake it. Pinned and audio tabs are left alone.</p>
  <script src="standby.js"></script>
  <script src="popup.js"></script>
</body></html>
